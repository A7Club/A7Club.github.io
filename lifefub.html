        function parseCSV(text) {
            let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0, l;
            for (l of text) {
                if ('"' === l) { if (s && l === p) row[i] += l; s = !s; }
                else if (',' === l && s) l = row[++i] = '';
                else if ('\n' === l && s) { if ('\r' === p) row[i] = row[i].slice(0, -1); row = ret[++r] = [l = '']; i = 0; }
                else row[i] += l;
                p = l;
            }
            return ret.filter(r => r.join('').trim() !== '');
        }

        async function loadSharedMedicalData() {
            if (globalMedicalData) return globalMedicalData;
            const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmr3ebvX4CeJ_Dc-TK_57zxqaVlXfI4CPVcgTAWAIKM29dtR-SqiFs93i2iz1ScwYEBcty8mlIxKYO/pub?gid=368795626&single=true&output=csv';
            try {
                const res = await fetch(csvUrl);
                const csvText = await res.text();
                const rows = parseCSV(csvText);
                if (!rows || rows.length === 0) return [];
                const headers = rows[0];

                let nameIdx = headers.findIndex(k => k.includes('名稱') || k.includes('機構'));
                if (nameIdx === -1) nameIdx = 0;
                let catIdx = headers.findIndex(k => k.includes('醫療分類'));
                if (catIdx === -1) catIdx = headers.length > 8 ? 8 : headers.length - 1;

                const addressIdx = headers.findIndex(k => k.includes('地址'));
                const phoneIdx = headers.findIndex(k => k.includes('電話'));
                const imgIdx = headers.findIndex(k => k.includes('照片') || k.includes('圖片'));
                const licenseIdx = 16;

                globalMedicalData = rows.slice(1).map(row => {
                    let rawImg = (imgIdx !== -1 && row.length > imgIdx && row[imgIdx]) ? row[imgIdx].trim() : '';
                    let finalImg = '';
                    const urlMatch = rawImg.match(/https?:\/\/[^\s]+/);
                    if (urlMatch) finalImg = urlMatch[0];

                    let licenseData = '';
                    if (row.length > licenseIdx) {
                        licenseData = row[licenseIdx] ? row[licenseIdx].trim() : '';
                    }

                    return {
                        name: row[nameIdx]?.trim() || '',
                        category: row[catIdx]?.trim() || '其他醫療',
                        address: addressIdx !== -1 ? row[addressIdx]?.trim() : '',
                        phone: phoneIdx !== -1 ? row[phoneIdx]?.trim() : '',
                        img: finalImg,
                        license: licenseData
                    };
                }).filter(item => item.name);
                return globalMedicalData;
            } catch (e) {
                return [];
            }
        }

        const TYFD_GAS_API_URL = ""; 

        let globalTyfdAllCases = [];

        window.setTyfdFilter = function (mode) {

        function parseTyfdHtml(rawText) {
            const allCases = [];
            const seenKeys = new Set();

            const cleanField = (str, label) => {
                if (!str) return '';
                return str
                    .replace(new RegExp('^\\s*' + label + '[：:\\s]*'), '')
                    .replace(/\s+/g, ' ')
                    .trim();
            };

            const addCase = (time, category, type, location, unit, status) => {
                if (!time || !location || !/\d{4}-\d{2}-\d{2}/.test(time)) return;
                const key = `${time}_${location}_${unit}`;
                if (!seenKeys.has(key)) {
                    seenKeys.add(key);
                    allCases.push({ time, category, type, location, unit, status });
                }
            };

            // 方法 1：解析標準 HTML table tr
            if (rawText.includes('<table') || rawText.includes('<tr')) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(rawText, 'text/html');
                const rows = doc.querySelectorAll('table tr');
                rows.forEach(tr => {
                    const tds = tr.querySelectorAll('td');
                    if (tds.length >= 6) {
                        addCase(
                            cleanField(tds[0].textContent, '發生時間'),
                            cleanField(tds[1].textContent, '案類'),
                            cleanField(tds[2].textContent, '案別'),
                            cleanField(tds[3].textContent, '發生地點'),
                            cleanField(tds[4].textContent, '派遣分隊'),
                            cleanField(tds[5].textContent, '案件狀態')
                        );
                    }
                });
            }

            // 方法 2：解析 Jina Reader 回傳的 Markdown 表格格式
            if (allCases.length === 0) {
                const mdRegex = /\|\s*(?:發生時間\s*)?(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})\s*\|\s*(?:案類\s*)?([^|]+?)\s*\|\s*(?:案別\s*)?([^|]+?)\s*\|\s*(?:發生地點\s*)?([^|]+?)\s*\|\s*(?:派遣分隊\s*)?([^|]+?)\s*\|\s*(?:案件狀態\s*)?([^|\n]+?)\s*\|/g;
                let m;
                while ((m = mdRegex.exec(rawText)) !== null) {
                    addCase(m[1].trim(), m[2].trim(), m[3].trim(), m[4].trim(), m[5].trim(), m[6].trim());
                }
            }

            // 方法 3：使用正規表示式從純文字擷取
            if (allCases.length === 0) {
                const bodyText = rawText.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
                const rowRegex = /發生時間\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})\s*案類\s*(\S+)\s*案別\s*(\S+)\s*發生地點\s*(.+?)\s*派遣分隊\s*(\S+)\s*(?:案件狀態\s*)?(已受理|已出動|處理中|已到達|已控制|已撲滅|已完成|返隊中|\S+)/g;
                let match;
                while ((match = rowRegex.exec(bodyText)) !== null) {
                    const [, time, category, type, location, unit, status] = match;
                    addCase(time.trim(), category.trim(), type.trim(), location.trim(), unit.trim(), status.trim());
                }
            }

            const timeMatch = rawText.match(/最後更新日期[：:]\s*([0-9\-:\s]+)/);
            const updatedTime = timeMatch ? timeMatch[1].trim() : '';

            return { cases: allCases, lastUpdated: updatedTime };
        }

        async function fetchSinglePageViaProxies(pageUrl) {
            // 1. 若有設定自建的 Google Apps Script API，優先使用 (最穩定、零阻擋)
            if (TYFD_GAS_API_URL) {
                const res = await fetch(`${TYFD_GAS_API_URL}?_t=${Date.now()}`, { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.cases)) return data;
                    if (data && data.html) return parseTyfdHtml(data.html);
                }
            }

            const cacheBustUrl = `${pageUrl}&_t=${Date.now()}`;

            const fetchFromProxy = async (proxyUrl, isJson = false, customHeaders = {}) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                try {
                    const res = await fetch(proxyUrl, {
                        signal: controller.signal,
                        cache: 'no-store',
                        headers: customHeaders
                    });
                    clearTimeout(timeoutId);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    let text = '';
                    if (isJson) {
                        const data = await res.json();
                        text = data.contents || '';
                    } else {
                        text = await res.text();
                    }
                    const parsed = parseTyfdHtml(text);
                    if (!parsed.cases || parsed.cases.length === 0) {
                        throw new Error('No valid cases parsed');
                    }
                    return parsed;
                } catch (e) {
                    clearTimeout(timeoutId);
                    throw e;
                }
            };

            // 2. 多節點並行請求 (包含 Jina Reader API 與多個 CORS 代理)
            return Promise.any([
                fetchFromProxy(`https://r.jina.ai/${pageUrl}`, false, { 'X-No-Cache': 'true' }),
                fetchFromProxy(`https://api.allorigins.win/get?disableCache=true&url=${encodeURIComponent(cacheBustUrl)}`, true),
                fetchFromProxy(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(cacheBustUrl)}`, false),
                fetchFromProxy(`https://corsproxy.io/?url=${encodeURIComponent(cacheBustUrl)}`, false)
            ]);
        }

        window.setMedicalFilter = function (cat) {
            currentMedicalCategory = cat;

        function renderMedicalData(data) {
            const container = document.getElementById('medical-list-container');
            if (!container) return;

            const grouped = {};
            data.forEach(i => {
                const catName = i.category || '一般/其他醫療';
                if (!grouped[catName]) grouped[catName] = [];
                grouped[catName].push(i);
            });

            if (Object.keys(grouped).length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 font-bold py-10 bg-white rounded-2xl border border-slate-200/80 shadow-sm">尚無相關醫療機構資料</div>';
                return;
            }

            const sortedCats = Object.keys(grouped).sort((a, b) => {
                const order = ['醫療中心', '牙', '小兒', '眼', '診所', '藥'];
                let aIdx = order.findIndex(o => a.includes(o));
                let bIdx = order.findIndex(o => b.includes(o));
                aIdx = aIdx === -1 ? 99 : aIdx;
                bIdx = bIdx === -1 ? 99 : bIdx;
                return aIdx - bIdx;
            });

            if (!grouped[currentMedicalCategory] && sortedCats.length > 0) {
                currentMedicalCategory = sortedCats[0];
            }

            const getCatTheme = (c) => {
                if (c.includes('醫療中心')) return { icon: 'fa-hospital', color: 'emerald' };
                if (c.includes('牙')) return { icon: 'fa-tooth', color: 'sky' };
                if (c.includes('小兒') || c.includes('婦產') || c.includes('兒童')) return { icon: 'fa-baby', color: 'pink' };
                if (c.includes('眼')) return { icon: 'fa-eye', color: 'purple' };
                if (c.includes('藥')) return { icon: 'fa-pills', color: 'amber' };
                if (c.includes('骨') || c.includes('復健')) return { icon: 'fa-bone', color: 'teal' };
                return { icon: 'fa-stethoscope', color: 'emerald' };
            };

            // 1. 頂部橫向分類膠囊列
            let tabsHtml = '<div class="flex items-center gap-2 overflow-x-auto hide-scrollbar pb-1">';
            sortedCats.forEach(cat => {
                const items = grouped[cat];
                const theme = getCatTheme(cat);
                const isActive = !currentMedicalKeyword && currentMedicalCategory === cat;
                const btnClasses = isActive
                    ? 'bg-slate-900 text-white shadow-sm border-slate-900'
                    : 'bg-white text-slate-600 hover:bg-slate-100 border-slate-200/90';

                tabsHtml += `
                    <button onclick="setMedicalFilter('${cat.replace(/'/g, "\\'")}')" 
                        class="shrink-0 flex items-center gap-2 px-3.5 py-2 rounded-xl font-black text-xs sm:text-sm border transition-all active:scale-95 ${btnClasses}">
                        <i class="fa-solid ${theme.icon} ${isActive ? 'text-emerald-400' : 'text-slate-400'}"></i>
                        <span>${cat}</span>
                        <span class="text-[11px] font-black px-1.5 py-0.5 rounded-md ${isActive ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-500'}">${items.length}</span>
                    </button>
                `;
            });
            tabsHtml += '</div>';

            // 2. 篩選要顯示的診所清單 (支援跨分類關鍵字搜尋)
            let activeItems = [];
            if (currentMedicalKeyword) {
                activeItems = data.filter(item =>
                    item.name.toLowerCase().includes(currentMedicalKeyword) ||
                    (item.address && item.address.toLowerCase().includes(currentMedicalKeyword)) ||
                    (item.category && item.category.toLowerCase().includes(currentMedicalKeyword))
                );
            } else {
                activeItems = grouped[currentMedicalCategory] || [];
            }

            // 3. 建立卡片列表：醫療中心採用 2 欄大卡 (md:grid-cols-2)，其他所有分類嚴格採用一行三間 (md:grid-cols-3)
            let cardsHtml = '';
            const isMedicalCenterCat = !currentMedicalKeyword && currentMedicalCategory.includes('醫療中心');
            const gridColsClass = isMedicalCenterCat
                ? 'grid-cols-1 md:grid-cols-2 gap-4'
                : 'grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3.5';

            if (activeItems.length === 0) {
                cardsHtml = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200/80 text-slate-400 font-bold text-sm">
                        找不到符合「${currentMedicalKeyword}」的醫療院所或藥局
                    </div>
                `;
            } else {
                cardsHtml = `
                    <div class="grid ${gridColsClass} fade-in">
                        ${activeItems.map(item => {
                            const theme = getCatTheme(item.category || currentMedicalCategory);
                            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.address || item.name)}`;
                            const thumbHtml = item.img
                                ? `<img src="${item.img}" class="${isMedicalCenterCat ? 'w-16 h-16' : 'w-12 h-12'} rounded-xl object-cover shrink-0 border border-slate-100 bg-slate-50" alt="${item.name}">`
                                : `<div class="${isMedicalCenterCat ? 'w-16 h-16 text-2xl' : 'w-12 h-12 text-lg'} rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center shrink-0"><i class="fa-solid ${theme.icon}"></i></div>`;

                            return `
                                <div class="bg-white p-3.5 rounded-2xl border border-slate-200/90 hover:border-emerald-400 shadow-sm hover:shadow-md transition-all flex flex-col justify-between gap-3 group/clinic">
                                    <div class="flex items-start gap-3">
                                        ${thumbHtml}
                                        <div class="min-w-0 flex-1">
                                            <div class="flex items-start justify-between gap-1.5">
                                                <h4 class="font-black text-slate-800 ${isMedicalCenterCat ? 'text-base sm:text-lg' : 'text-sm'} leading-snug truncate group-hover/clinic:text-emerald-600 transition-colors" title="${item.name}">${item.name}</h4>
                                            </div>
                                            <div class="flex items-center flex-wrap gap-1.5 mt-1">
                                                <span class="text-[10px] font-black bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">${item.category || currentMedicalCategory}</span>
                                                ${item.license ? `<span class="text-[10px] text-slate-400 font-bold truncate" title="${item.license}">${item.license.includes('字第') ? item.license : '衛醫字第 ' + item.license}</span>` : ''}
                                            </div>
                                        </div>
                                    </div>

                                    <div class="flex items-center justify-between gap-2 pt-2.5 border-t border-slate-100">
                                        <a href="${mapUrl}" target="_blank" class="text-xs font-bold text-slate-500 hover:text-emerald-600 flex items-center gap-1.5 min-w-0 flex-1 truncate" title="${item.address || '點擊開啟地圖'}">
                                            <i class="fa-solid fa-location-dot text-slate-400 shrink-0"></i>
                                            <span class="truncate">${(item.address || '查看地圖位置').replace(/桃園市|龜山區/g, '')}</span>

                                        <div class="flex items-center gap-1.5 shrink-0">
                                            ${item.phone ? `
                                            <a href="tel:${item.phone}" title="撥打電話：${item.phone}" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-xs transition-colors">
                                                <i class="fa-solid fa-phone"></i>
                                            </a>
                                            ` : ''}
                                            <a href="${mapUrl}" target="_blank" class="px-2.5 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white text-xs font-black flex items-center gap-1 transition-colors">
                                                <i class="fa-solid fa-location-arrow text-[10px]"></i> 導航
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            container.innerHTML = tabsHtml + cardsHtml;

            document.querySelectorAll('.js-count-medical').forEach(el => {
                el.textContent = `${data.length} 間`;
            });
        }

        // 智慧解析引擎
        function searchVillage(input) {
            const cleanedInput = input.replace(/^\d{3,5}\s*/, '').replace(/台灣|臺灣|桃園市|桃園縣|龜山區|龜山鄉|林口區|林口鄉/g, '').trim();
            if (!cleanedInput) return [];
            let parsedStreet = "";
            let parsedNum = null;
            const match = cleanedInput.match(/([一-龥]+(?:路|街|大道|段))((?:\d+巷)?(?:\d+弄)?)(?:\s*(\d+)(?:[~-～－]\d+)?\s*(?:號|之))?/);
            if (match) {
                parsedStreet = match[1];
                if (match[2]) parsedStreet += match[2].trim();
                if (match[3]) parsedNum = parseInt(match[3], 10);
            } else {
                parsedStreet = cleanedInput.replace(/\d+[~-～－]?\d*號?/, '').trim();
            }
            let strongMatches = [];
            let weakMatches = [];
            for (const item of VILLAGE_DATA) {
                if (item.village === cleanedInput || item.village.replace('里', '') === cleanedInput) {
                    strongMatches.push({ ...item, matchType: 'village' });
                    continue;
                }
                if (item.tag && (item.tag.includes(cleanedInput) || cleanedInput.includes(item.tag.replace(/相關社區|社區/g, '')))) {
                    strongMatches.push({ ...item, matchType: 'tag' });
                    continue;
                }
                for (const streetStr of item.streets) {
                    if (!streetStr.includes(parsedStreet)) continue;
                    if (!parsedStreet.includes("巷") && (new RegExp(parsedStreet + "\\d+巷")).test(streetStr)) continue;
                    if (parsedNum !== null) {
                        let isMatch = false;
                        const hasGlobalEven = (streetStr.match(/雙/g) || []).length > 0 && (streetStr.match(/單/g) || []).length === 0;
                        const hasGlobalOdd = (streetStr.match(/單/g) || []).length > 0 && (streetStr.match(/雙/g) || []).length === 0;
                        const rangeRegex = /(\d+)\s*(?:號)?\s*(?:至|~|-|～|－)\s*(\d+)\s*(?:號)?(?:[^0-9,，]{0,10}?(單|雙))?/g;
                        let rMatch;
                        let rangeFound = false;
                        while ((rMatch = rangeRegex.exec(streetStr)) !== null) {
                            rangeFound = true;
                            let start = parseInt(rMatch[1], 10);
                            let end = parseInt(rMatch[2], 10);
                            if (start > end) { let temp = start; start = end; end = temp; }
                            if (parsedNum >= start && parsedNum <= end) {
                                const isEven = parsedNum % 2 === 0;
                                const localModifier = rMatch[3];
                                const requiresEven = localModifier === '雙' || (!localModifier && hasGlobalEven);
                                const requiresOdd = localModifier === '單' || (!localModifier && hasGlobalOdd);
                                if (requiresEven && !isEven) continue;
                                if (requiresOdd && isEven) continue;
                                isMatch = true;
                                break;
                            }
                        }
                        if (isMatch) {
                            strongMatches.push({ ...item, matchType: 'condition', matchedRule: streetStr });
                            continue;
                        }
                        if (!rangeFound || !isMatch) {
                            const stringWithoutRanges = streetStr.replace(/(\d+)\s*(?:號)?\s*(?:至|~|-|～|－)\s*(\d+)\s*(?:號)?/g, '');
                            const exactRegex = /(\d+)/g;
                            let exactMatch;
                            while ((exactMatch = exactRegex.exec(stringWithoutRanges)) !== null) {
                                if (parseInt(exactMatch[0], 10) === parsedNum) {
                                    isMatch = true;
                                    break;
                                }
                            }
                            if (!isMatch && !rangeFound) {
                                if (hasGlobalEven && parsedNum % 2 === 0) isMatch = true;
                                if (hasGlobalOdd && parsedNum % 2 === 1) isMatch = true;
                            }
                            const hasNumbers = /\d/.test(streetStr.replace(/第\d+鄰/g, ''));
                            if (!hasNumbers) {
                                strongMatches.push({ ...item, matchType: 'street_only', matchedRule: streetStr });
                                continue;
                            }
                            if (isMatch) strongMatches.push({ ...item, matchType: 'condition', matchedRule: streetStr });
                            else weakMatches.push({ ...item, matchType: 'street_only', matchedRule: streetStr });
                        }
                    } else {
                        weakMatches.push({ ...item, matchType: 'street_only', matchedRule: streetStr });
                    }
                }
            }
            const uniqueStrong = [];
            const seen = new Set();
            const hasConditionMatch = strongMatches.some(m => m.matchType === 'condition' || m.matchType === 'tag' || m.matchType === 'village');
            const filteredStrong = hasConditionMatch ? strongMatches.filter(m => m.matchType !== 'street_only') : strongMatches;
            for (const match of filteredStrong) {
                const key = match.village + (match.neighborhoods ? match.neighborhoods.join(',') : '');
                if (!seen.has(key)) { seen.add(key); uniqueStrong.push(match); }
            }
            return uniqueStrong.length > 0 ? uniqueStrong : weakMatches;
        }

        function checkSchoolDistrict() {
            const inputEl = document.getElementById('school-address-input');
            const msgBox = document.getElementById('school-result');
            if (!inputEl || !msgBox) return;
            const input = inputEl.value.trim();
            if (!input) {
                msgBox.innerHTML = '<div class="bg-red-50 text-red-500 text-sm font-bold p-4 rounded-xl border border-red-200 flex items-center justify-center w-full h-full shadow-sm"><i class="fa-solid fa-circle-exclamation mr-2 text-lg"></i>請輸入地址或路名！</div>';
                msgBox.classList.remove('hidden');
                resetSchoolHighlight();
                return;
            }

            const results = searchVillage(input);
            let newVillage = "";
            let neighborhood = null;
            let found = results.length > 0;
            let isPrecise = false;

            if (found) {
                isPrecise = results.some(r => r.matchType === 'condition' || r.matchType === 'tag' || r.matchType === 'village');
                if (isPrecise) {
                    const preciseMatch = results.find(r => r.matchType === 'condition' || r.matchType === 'tag' || r.matchType === 'village');
                    newVillage = preciseMatch.village;
                    if (preciseMatch.neighborhoods && preciseMatch.neighborhoods.length === 1) {
                        neighborhood = preciseMatch.neighborhoods[0];
                    }
                } else {
                    const uniqueVillages = [...new Set(results.map(r => r.village))];
                    if (uniqueVillages.length === 1) newVillage = uniqueVillages[0];
                    else newVillage = "AMBIGUOUS";
                }
            } else {
                const cleanedInput = input.replace(/桃園市|龜山區|林口區/g, '').trim();
                if (cleanedInput.includes('文青') || cleanedInput.includes('文藝') || cleanedInput.includes('青山路')) { newVillage = '文青里'; }
                else if (cleanedInput.includes('文桃') || cleanedInput.includes('體大') || cleanedInput.includes('牛角坡路') || cleanedInput.includes('樂善一路') || cleanedInput.includes('文信路')) { newVillage = '文桃里'; }
                else if (cleanedInput.includes('樂善') || cleanedInput.includes('文樂')) { newVillage = '樂善里'; }
                else if (cleanedInput.includes('長樂') || cleanedInput.includes('長慶')) { newVillage = '長樂里'; }
                else if (cleanedInput.includes('文德二路')) { newVillage = '樂善里'; }
                else if (cleanedInput.includes('長庚') || cleanedInput.includes('文德')) { newVillage = '長庚里'; }
            }

            if (newVillage === "AMBIGUOUS") {
                msgBox.innerHTML = `
                    <div class="bg-yellow-50 rounded-xl p-4 border border-yellow-200 shadow-sm flex flex-col items-center justify-center text-center h-full w-full">
                        <div class="text-sm text-gray-600 font-bold mb-1"><i class="fa-solid fa-triangle-exclamation text-orange-500 mr-1.5"></i>此路段涵蓋多個學區</div>
                        <div class="text-[11px] text-gray-500 font-bold leading-relaxed">由於政府尚未公告詳細門牌，無法精確定位您的學區。<br>請向戶政機關或學校確認。</div>
                    </div>
                `;
                msgBox.classList.remove('hidden');
                resetSchoolHighlight();
                return;
            }

            let schoolResult = "";
            let isFree = false;

            if (newVillage === '文青里' || newVillage === '文藝里') {
                schoolResult = "文青國中小、大埔國小";
                isFree = true;
            } else if (newVillage === '文桃里') {
                schoolResult = "文青國中小";
            } else if (newVillage === '樂善里' || newVillage === '文樂里') {
                schoolResult = "樂善國小、文青國中小";
                isFree = true;
            } else if (newVillage === '長樂里') {
                if (neighborhood !== null && neighborhood >= 10 && neighborhood <= 21) {
                    schoolResult = "樂善國小、長庚國小";
                    isFree = true;
                } else if (neighborhood !== null && neighborhood >= 1 && neighborhood <= 9) {
                    schoolResult = "樂善國小、文青國中小";
                    isFree = true;
                } else {
                    schoolResult = "需確認確切鄰別 (1-9鄰為樂善/文青；10-21鄰為樂善/長庚)";
                    isFree = true;
                }
            } else if (newVillage === '長庚里') {
                schoolResult = "長庚國小";
            }

            if (schoolResult) {
                msgBox.innerHTML = `
                    <div class="bg-white rounded-xl p-4 border border-blue-200 shadow-sm flex flex-col items-center justify-center text-center h-full w-full">
                        <div class="text-xs text-blue-500 font-bold mb-1">根據最新區劃 (${newVillage}${neighborhood ? ' ' + neighborhood + '鄰' : ''})</div>
                        <div class="text-lg md:text-xl font-black text-blue-800 mb-2 flex items-center justify-center flex-wrap gap-2">

                            ${isFree ? `<span class="bg-blue-50 text-blue-600 text-[10px] px-2 py-0.5 rounded border border-blue-200 shadow-sm ml-1"><i class="fa-solid fa-check text-blue-400 mr-1"></i>自由學區</span>` : ''}

                    </div>
                `;
                highlightSchoolsByVillage(newVillage);
            } else {
                msgBox.innerHTML = `
                    <div class="bg-yellow-50 rounded-xl p-4 border border-yellow-200 shadow-sm flex flex-col items-center justify-center text-center h-full w-full">
                        <div class="text-sm text-gray-600 font-bold"><i class="fa-solid fa-circle-exclamation text-yellow-500 mr-1.5"></i>無法精確判斷此地址的學區</div>

                resetSchoolHighlight();

        function highlightSchoolsByVillage(village) {
            const schoolCards = document.querySelectorAll('#school .group');
            let found = false;
            schoolCards.forEach(card => {
                const text = card.textContent;
                if (text.includes(village) || text.includes(village.replace('里', ''))) {
                    card.classList.add('ring-4', 'ring-themeBlue', 'ring-offset-2');
                    card.classList.remove('opacity-50');
                    found = true;
                } else {
                    card.classList.remove('ring-4', 'ring-themeBlue', 'ring-offset-2');
                    card.classList.add('opacity-50');
                }
            });

            // 同步高亮右側學區表格對應的行政里別列
            const tableRows = document.querySelectorAll('#village-district-tbody tr[data-village]');
            tableRows.forEach(row => {
                if (row.getAttribute('data-village') === village) {
                    row.classList.add('bg-blue-50/90', 'ring-2', 'ring-inset', 'ring-blue-400');
                } else {
                    row.classList.remove('bg-blue-50/90', 'ring-2', 'ring-inset', 'ring-blue-400');
                }
            });

            if (!found && village !== "AMBIGUOUS") {
                const msgEl = document.getElementById('school-result');
                if (msgEl) {
                    const originalHtml = msgEl.innerHTML;
                    msgEl.innerHTML = originalHtml + `<div class="mt-3 pt-3 border-t border-blue-100 text-sky-500 font-bold text-sm"><i class="fa-solid fa-circle-exclamation mr-1.5"></i>目前清單中尚無明確標示屬於「${village}」的學區，建議直接聯繫區公所確認喔！</div>`;
                }
            }
        }

        // 🌟 全域關鍵字高亮與捲動邏輯
        function highlightAndScrollTo(query) {
            if (!query) return;
            const q = query.toLowerCase();
            const safeQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
            let node;
            const matches = [];
            while (node = walker.nextNode()) {
                const text = node.textContent;
                const parent = node.parentElement;
                if (text.toLowerCase().includes(q) && !['SCRIPT', 'STYLE', 'NAV', 'FOOTER', 'HEADER', 'BUTTON', 'I'].includes(parent.tagName)) {
                    matches.push(node);
                }
            }

            if (matches.length > 0) {
                const firstMatch = matches[0];
                const parent = firstMatch.parentElement;
                let p = parent;
                while (p && p !== document.body) {
                    if (p.tagName === 'DETAILS') p.open = true;
                    p = p.parentElement;
                }
                const text = firstMatch.textContent;
                const regex = new RegExp(`(${safeQ})`, 'gi');
                const span = document.createElement('span');
                span.innerHTML = text.replace(regex, '<mark class="bg-yellow-200 text-gray-900 px-1 rounded shadow-sm font-black">$1</mark>');
                parent.replaceChild(span, firstMatch);
                setTimeout(() => {
                    span.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 800);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('search');
            if (query) {
                setTimeout(() => highlightAndScrollTo(query), 1200);
            }

            const addressQuery = params.get('address');
            if (addressQuery) {
                const schoolInput = document.getElementById('school-address-input');
                if (schoolInput) {
                    schoolInput.value = addressQuery;
                    setTimeout(() => {
                        checkSchoolDistrict();
                    }, 500);
                }
            }
        });

        // 🌟 捲動並開啟醫療分類面板
        function scrollToMedicalCategory(keyword) {
            const keywords = Array.isArray(keyword) ? keyword : [keyword];
            
            if (globalMedicalData) {
                const grouped = {};
                globalMedicalData.forEach(i => {
                    const catName = i.category || '一般/其他醫療';
                    if (!grouped[catName]) grouped[catName] = [];
                    grouped[catName].push(i);
                });
                
                const cats = Object.keys(grouped);
                for (let c of cats) {
                    if (keywords.some(k => c.includes(k))) {
                        setMedicalFilter(c);
                        setTimeout(() => {
                            const target = document.getElementById('medical-list-container');
                            if (target) {
                                const headerOffset = 150;
                                const elementPosition = target.getBoundingClientRect().top;
                                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                                window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                            }
                        }, 100);
                        break;
                    }
                }
            }
        }
    </script>
</body>

</html>
